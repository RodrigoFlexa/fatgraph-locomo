# G4 -- fatgraph-sigma: G1 + expansão pela órbita de sigma na recuperação.
#
# Hipótese: uma pergunta multi-hop é, no fatgraph, duas memórias na MESMA
# órbita de sigma (duas arestas incidentes no mesmo vértice). O salto é sigma.
# phi = sigma∘alpha sai do vértice a cada passo, então a face só reencontra a
# entidade-ponte depois de uma volta inteira, em geral além do budget_tokens.
#
# Esta condição difere da G1 em EXATAMENTE um bloco: retrieval.sigma_*.
# O ingest é idêntico, então o delta G4 − G1 não pode ser atribuído a nada além
# da recuperação — nem a variação de extração, nem a resolução de entidades.
#
# Essa igualdade é VERIFICADA, não imposta: a G4 constrói o próprio grafo, e
# `graph_stats.fingerprint` (hash de conteúdo do ribbon graph) tem de bater com
# o da G1. Emprestar o diretório da G1 garantiria a igualdade por construção,
# mas ao custo de tornar estes resultados um artefato da rodada dela.
#
# Autossuficiente: constrói grafo e resultados próprios, sem depender de rodada
# anterior. Resultados em results/G4-fatgraph-sigma/.
extends: base.yaml
condition: G4-fatgraph-sigma

ingest:
  sigma_policy: sigma-time
curation:
  curation: false
  consolidation: false

retrieval:
  sigma_expand: true
  sigma_expand_k: 4
  sigma_expand_both_ends: true
  sigma_expand_max_anchors: 2
  sigma_budget_frac: 0.4
  sigma_rerank: true

paths:
  # Constrói os SEUS PRÓPRIOS grafos. O ingest é idêntico ao da G1 e os fatos
  # vêm do mesmo cache condition-independent, então o grafo sai igual — e isso
  # agora é VERIFICADO em vez de imposto: `graph_stats.fingerprint` é um hash de
  # conteúdo do ribbon graph, e o report compara os das condições que alegam
  # diferir só na recuperação. Emprestar o diretório da G1 tornaria estes
  # resultados um artefato da rodada dela.
  graphs_condition: ""
