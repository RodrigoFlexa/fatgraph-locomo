# Base configuration shared by every experimental condition.
# Condition files use `extends: base.yaml` and override only what differs.
#
# Secrets are NEVER read from here. The Azure client reads
# AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_API_KEY / AZURE_OPENAI_API_VERSION
# from the environment. Only the *deployment name* lives in this file.

seed: 1234

llm:
  provider: azure          # azure | fake  (fake = offline, deterministic)
  deployment: gpt-4o-mini  # Azure deployment name
  temperature: 0.0
  max_tokens: 512
  seed: 1234
  request_timeout: 60.0
  max_retries: 6
  backoff_base: 2.0
  backoff_max: 60.0
  cache_dir: .cache/llm
  cache_enabled: true

  # Aborta em vez de transformar resposta vazia em abstenção silenciosa.
  fail_on_empty: true

  # auto | chat | reasoning. 'auto' detecta pelo nome do deployment
  # (gpt-5*, o1*, o3*, o4* => reasoning).
  api_style: auto
  # Modelos de reasoning gastam este orçamento pensando ANTES de responder.
  # 0 = não enviar limite algum (como no notebook que funciona).
  reasoning_min_tokens: 4000
  # minimal | low | medium | high | "" para omitir
  reasoning_effort: low

embeddings:
  provider: sentence-transformers   # sentence-transformers | azure | hashing
  model: all-MiniLM-L6-v2

  # Azure: nome do DEPLOYMENT, não do modelo. embedding-3-large-global tem
  # saída de 3072 dimensões e é o mais forte do hub; -3-small tem 1536.
  azure_deployment: embedding-3-large-global
  # Truncagem Matryoshka. Vazio = largura cheia (3072). 1024 corta a memória
  # do índice em 3x com perda pequena. Entra na chave do cache.
  azure_dimensions:
  azure_max_input_tokens: 8192
  azure_max_batch_tokens: 60000

  dim: 384                          # provider `hashing` apenas
  batch_size: 64
  cache_dir: .cache/embeddings
  normalize: true

index:
  backend: numpy   # numpy | faiss  (falls back to numpy if faiss is missing)
  metric: cosine

entities:
  match_threshold: 0.85
  llm_threshold: 0.70
  max_candidates: 5

ingest:
  sigma_policy: sigma-time   # sigma-time | sigma-agent
  detect_incongruence: true
  max_facts_per_session: 0
  allow_self_loops: false
  sigma_agent_max_trails: 8
  sigma_agent_trail_chars: 160

curation:
  curation: false
  consolidation: false
  min_face_len: 4        # L
  min_stable_sessions: 2 # k
  # Movimentos de Whitehead PRESERVAM a superfície: contrair e reexpandir uma
  # aresta é movimento de spine, e whitehead_flip levanta exceção se gênero ou F
  # mudarem. Logo eles não podem reformar faces. O movimento que reforma é a
  # transposição em sigma, abaixo.
  whitehead_flip: false  # phase 2

  # Depois do ingest, busca local em sigma maximizando o número de faces. Por
  # Euler (F = 2C - 2g + E - V), com V e E fixos, maximizar F É minimizar o
  # gênero — e mais faces sobre as mesmas meias-arestas significa faces mais
  # CURTAS, que é exatamente o modo de falha medido (trilhas de 300+
  # meias-arestas produzidas por ordenar sigma pelo relógio).
  # Exige grafos próprios: sigma diferente é ribbon graph diferente.
  maximize_faces: false
  maximize_faces_passes: 6
  maximize_faces_degree_scan: 48

retrieval:
  top_m_anchors: 5
  budget_tokens: 2000
  level2_boost: 0.05
  shadowed_penalty: 0.10
  incongruent_abstain: true
  recall_ks: [5, 10]
  max_facts_in_prompt: 40
  # Teto da fatia do prompt que os mecanismos de multi-hop (sigma/cobertura/
  # geodésica) podem ocupar quando os dois competem. Prioridade ABSOLUTA para
  # os joins deixava uma trilha de cobertura longa evacuar TODO fato de âncora,
  # e aí G5/G6 deixam de ser superconjuntos da G1 — a comparação para a qual as
  # condições existem. É piso e teto ao mesmo tempo: o que uma parte não usa a
  # outra aproveita. Ignorado quando os dois flags estão desligados.
  max_facts_join_frac: 0.5
  # Modelos de reasoning (o1/o3/o4-mini, gpt-5) gastam este orçamento com
  # raciocínio interno e devolvem vazio se ele acabar. Nesses casos: 3000+.
  answer_max_tokens: 64

  # Categoria 3 (open-domain) pergunta o que é PROVÁVEL, então a resposta quase
  # nunca está literal no contexto. Sob a instrução extrativa o modelo conclui
  # corretamente que o texto não está lá e abstém: medido em F1 0.069 para a
  # baseline full-context, cujo recall de evidência nessa categoria era 0.97.
  # Isso é a instrução recusando a tarefa, não a recuperação falhando.
  # Vale para as baselines também, para os braços seguirem comparáveis.
  open_domain_inference: true

  # Embaralha os fatos antes de renderizar o prompt. Tudo que um ribbon graph
  # acrescenta a um grafo comum é ORDEM, então esta é a ablation que sustenta a
  # tese inteira: se o F1 não se mover com a ordem destruída, otimizar sigma não
  # pode pagar. Ligado só pela condição G8.
  shuffle_context: false

  # --- expansão por sigma (multi-hop) ------------------------------------
  # Pergunta multi-hop = duas memórias que compartilham uma entidade = duas
  # meias-arestas na MESMA órbita de sigma. phi = sigma∘alpha sai do vértice a
  # cada passo, então a face só reencontra aquela entidade depois de uma volta
  # inteira — em geral além do budget. Percorrer sigma direto É o salto.
  # DESLIGADO por padrão: G1/G2/G3 têm de continuar produzindo os mesmos
  # números de antes. A condição G4 liga isto e só isto.
  sigma_expand: false
  sigma_expand_k: 4              # vizinhos mantidos por órbita
  sigma_expand_both_ends: true   # expande de h e de alpha(h)
  sigma_expand_max_anchors: 2    # só os N primeiros âncoras (0 = todos)
  sigma_budget_frac: 0.4         # fatia de budget_tokens reservada a sigma
  sigma_rerank: true             # ordena a órbita por similaridade, não por ciclo
  sigma_max_orbit_scan: 64       # teto de meias-arestas pontuadas num hub

  # --- recuperação por face com cobertura de entidades (multi-hop) --------
  # O ranking de âncoras pergunta "que fato PARECE a pergunta?" — é o que todo
  # RAG faz e é o que torna o single-hop fácil. Uma pergunta multi-hop nomeia
  # duas entidades e a resposta está numa trilha ENTRE elas, então a pergunta
  # útil é "que face cobre as entidades que a pergunta nomeia?". Cobertura é
  # sinal estrutural: uma face que passa pelos dois vértices é candidata a
  # ponte mesmo que nenhum fato dela pareça com a pergunta.
  # DESLIGADO por padrão. G5 liga isto; G6 liga isto e a expansão por sigma.
  face_coverage: false
  coverage_weight: 1.0             # peso da cobertura contra a similaridade
  coverage_sim_aggregate: top2     # max | top2 | mean (mean penaliza face longa)
  coverage_budget_frac: 0.4        # fatia de budget_tokens para as faces cobertas
  coverage_max_entities: 4         # entidades linkadas a partir da pergunta
  coverage_max_faces: 24           # teto de faces candidatas pontuadas
  # Faces são LONGAS (200+ é normal, COERENCIA C9). Sem este teto uma única
  # trilha enche max_facts_in_prompt sozinha e sufoca o caminho dos âncoras e a
  # expansão por sigma — medido, não suposto. Metade do teto do prompt é o
  # compromisso entre profundidade numa trilha e diversidade entre trilhas;
  # é o primeiro knob a varrer se a G5 render menos que o esperado.
  coverage_max_facts_per_face: 20
  coverage_entity_threshold: 0.75  # cosseno mínimo p/ aceitar vértice sem match literal
  coverage_geodesic_fallback: true # caminho mínimo quando nenhuma face cobre 2+
  coverage_geodesic_max_depth: 3

baselines:
  rag_top_k: 10
  full_context_max_tokens: 110000
  full_context_truncate: head

paths:
  locomo_repo: data/external/locomo
  data_file: data/external/locomo/data/locomo10.json
  prompts_dir: prompts
  results_dir: results
  graphs_dir: artifacts/graphs
  facts_cache: artifacts/facts
  logs_dir: artifacts/logs
  # Vazio = cada condição lê/escreve graphs_dir/<condition>. Preenchido, a
  # condição REUTILIZA os grafos de outra (usado por G4 para rodar sobre os
  # grafos idênticos da G1, isolando a recuperação).
  graphs_condition: ""
