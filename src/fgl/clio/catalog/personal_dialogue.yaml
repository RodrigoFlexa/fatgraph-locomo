# Sigma: minimum viable relation catalog for personal dialogue memory.
# See CLIO-especificacao-tecnica.md section 4.3. Grown only through
# clio.catalog.mine_unmapped + a human review of unmapped_queue (section
# 4.4) -- never by widening the extractor's freedom to invent labels.

# NOTE on lives_in: the spec's own catalog (section 4.3) declares it
# invertible: false, but its own worked access trace (T3, section 17.3)
# walks FROM a place BACK to whoever lives there -- unreachable without an
# inverse. Multiple people can share a residence, so the inverse is a real,
# useful query ("who lives/lived here"), not just a T3 patch -- declared
# invertible here, unlike the spec document.

types: [Person, Organization, Place, Activity, Object, Event, Topic]

# Types that name the same KIND of thing in ordinary dialogue and must
# never yield two vertices for one name. Phase 1 types a brand-new entity
# from the relation's own signature, so "the charity race" reached through
# `practices` (Activity) and through `attended` (Event) used to become two
# separate vertices with the same name -- and fold could never repair it,
# because a type mismatch scores 0.0 before any other signal is looked at.
# Every multi-hop path through that thing was simply absent.
#
# Kept deliberately narrow: Place and Organization are NOT in a class
# together, because "Vertex the company" and "Vertex the place" being one
# vertex is a real error, not a repair.
type_classes:
  - [Activity, Event, Topic]

relations:
  # --- residence and location ---
  - name: lives_in
    signature: [Person, Place]
    cardinality: functional
    volatility: slow
    invertible: true
    inverse_name: resided_by
    dependents: []

  - name: born_in
    signature: [Person, Place]
    cardinality: functional
    volatility: static
    invertible: false

  # --- work ---
  - name: works_at
    signature: [Person, Organization]
    cardinality: functional
    volatility: slow
    invertible: true
    inverse_name: employs
    dependents: [managed_by, works_with, has_role]

  - name: has_role
    signature: [Person, Topic]
    cardinality: functional
    volatility: slow
    invertible: false

  - name: managed_by
    signature: [Person, Person]
    cardinality: functional
    volatility: slow
    invertible: true
    inverse_name: manages

  - name: works_with
    signature: [Person, Person]
    cardinality: multi
    volatility: slow
    invertible: true
    inverse_name: works_with

  - name: hired
    signature: [Person, Person]
    cardinality: multi
    volatility: static
    invertible: true
    inverse_name: hired_by

  # --- personal relationships ---
  - name: family_of
    signature: [Person, Person]
    cardinality: multi
    volatility: static
    invertible: true
    inverse_name: family_of

  - name: partner_of
    signature: [Person, Person]
    cardinality: functional
    volatility: slow
    invertible: true
    inverse_name: partner_of

  - name: friend_of
    signature: [Person, Person]
    cardinality: multi
    volatility: slow
    invertible: true
    inverse_name: friend_of

  # --- likes and activities ---
  - name: practices
    signature: [Person, Activity]
    cardinality: multi
    volatility: slow
    invertible: false

  - name: likes
    signature: [Person, Topic]
    cardinality: multi
    volatility: slow
    invertible: false

  - name: dislikes
    signature: [Person, Topic]
    cardinality: multi
    volatility: slow
    invertible: false

  # --- possessions ---
  - name: owns
    signature: [Person, Object]
    cardinality: multi
    volatility: slow
    invertible: true
    inverse_name: owned_by

  # --- plans and events ---
  - name: attended
    signature: [Person, Event]
    cardinality: multi
    volatility: fast
    invertible: true
    inverse_name: attended_by
    aliases_surface: [participated_in_event, participated_in, went_to]

  - name: plans_to
    signature: [Person, Event]
    cardinality: multi
    volatility: fast
    invertible: false

  # --- study ---
  - name: studies_at
    signature: [Person, Organization]
    cardinality: functional
    volatility: slow
    invertible: true
    inverse_name: enrolls
    dependents: [studies_subject]

  - name: studies_subject
    signature: [Person, Topic]
    cardinality: multi
    volatility: slow
    invertible: false

  # --- high-value relations mined from LoCoMo's UNMAPPED queue ---
  # These are deliberately canonical families, not one label per phrasing.
  - name: researches
    signature: [Person, Topic]
    cardinality: multi
    volatility: fast
    invertible: false
    aliases_surface: [researches_adoption_agencies, researching, researched]

  - name: created
    signature: [Person, Object]
    cardinality: multi
    volatility: static
    invertible: true
    inverse_name: created_by
    aliases_surface: [created_drawing, created_art, painted, drew, made]

  - name: member_of
    signature: [Person, Organization]
    cardinality: multi
    volatility: slow
    invertible: true
    inverse_name: has_member
    aliases_surface: [member_of_support_group, joined_group, belongs_to]

  - name: supports
    signature: [Person, Person]
    cardinality: multi
    volatility: slow
    invertible: true
    inverse_name: supported_by
    aliases_surface: [helped_and_supported, provides_support_to, wants_to_provide_support_to]

  - name: received_support_from
    signature: [Person, Person]
    cardinality: multi
    volatility: slow
    invertible: true
    inverse_name: gave_support_to
    aliases_surface:
      - received_love_and_support
      - has_support_network
      - has_support_system
      - having_support

  - name: parent_of
    signature: [Person, Person]
    cardinality: multi
    volatility: static
    invertible: true
    inverse_name: child_of

  - name: married_to
    signature: [Person, Person]
    cardinality: functional
    volatility: slow
    invertible: true
    inverse_name: married_to

  - name: learned
    signature: [Person, Topic]
    cardinality: multi
    volatility: slow
    invertible: false
    aliases_surface: [learned_lesson, was_taught]

  - name: symbolizes
    signature: [Topic, Topic]
    cardinality: multi
    volatility: static
    invertible: false
    aliases_surface: [represent, represents, mean, stands_for, stand_for]
